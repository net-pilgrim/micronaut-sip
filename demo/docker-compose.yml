services:
  # Edge SIP Proxy routing inbound traffic to backend sip-app
  sip-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: demo-sip-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./proxy/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    depends_on:
      - sip-app

  # Unified Micronaut SIP application hosting all controllers
  sip-app:
    build:
      context: ..
      dockerfile: demo/app/Dockerfile
    container_name: demo-sip-app
    restart: unless-stopped
    network_mode: host
    environment:
      - SIP_SERVER_UDP_HOST=0.0.0.0
      - SIP_SERVER_UDP_PORT=5066
      - SIP_SERVER_TCP_HOST=0.0.0.0
      - SIP_SERVER_TCP_PORT=5066
      - SIP_SERVER_ADVERTISED_IP=127.0.0.1
      - MRCP_SERVER_PORT=1554
      - MRCP_SERVER_ENABLED=true
      - RTP_PORT_RANGE_START=40000
      - RTP_PORT_RANGE_END=40050
      - SIP_RTP_PORT_RANGE_START=40000
      - SIP_RTP_PORT_RANGE_END=40050
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_AUDIO_API_KEY=${MISTRAL_AUDIO_API_KEY:-}
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
      - LOG_LEVEL=INFO
