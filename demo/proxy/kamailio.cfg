#!KAMAILIO

debug=2
log_stderror=yes
children=2

listen=udp:127.0.0.1:5080
listen=tcp:127.0.0.1:5080

alias="127.0.0.1:5080"
alias="127.0.0.1"

tcp_reuse_port=yes
tcp_connection_lifetime=3600

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "textops.so"
loadmodule "siputils.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

request_route {
    # 0. Force rport for NAT and port traversal
    force_rport();

    # 1. Max-Forwards sanity check (RFC 3261 §8.1.1.6)
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # 2. General SIP sanity checks
    if (!sanity_check()) {
        exit;
    }

    # 3. Handle OPTIONS ping directly targeted at the proxy
    if (is_method("OPTIONS") && $rU == $null) {
        sl_send_reply("200", "Proxy Alive");
        exit;
    }

    # 4. Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # 5. Handle sequential in-dialog requests (loose routing per RFC 3261 §16.4)
    if (has_totag()) {
        if (loose_route()) {
            xlog("L_INFO", "[PROXY] Routing in-dialog $rm from $si:$sp to $ru\n");
            if ($sp == 5066) {
                $du = $null;
            } else {
                if (proto == TCP) {
                    $du = "sip:127.0.0.1:5066;transport=tcp";
                } else {
                    $du = "sip:127.0.0.1:5066;transport=udp";
                }
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        } else {
            if (is_method("ACK")) {
                if ($sp != 5066) {
                    if (proto == TCP) {
                        $du = "sip:127.0.0.1:5066;transport=tcp";
                    } else {
                        $du = "sip:127.0.0.1:5066;transport=udp";
                    }
                }
                if (!t_relay()) {
                    sl_reply_error();
                }
                exit;
            }
            if (is_method("BYE")) {
                if (!t_relay()) {
                    sl_reply_error();
                }
                exit;
            }
            sl_send_reply("404", "Not Here");
            exit;
        }
    }

    # 6. Record-Route for dialog-initiating requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route_preset("127.0.0.1:5080;transport=tcp;lr=on");
    }

    # 7. Route initial request to backend sip-app application server on port 5066
    xlog("L_INFO", "[PROXY] Forwarding initial $rm for user '$rU' from $fu to 127.0.0.1:5066\n");
    if (proto == TCP) {
        $du = "sip:127.0.0.1:5066;transport=tcp";
    } else {
        $du = "sip:127.0.0.1:5066;transport=udp";
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
