plugins {
    id("io.micronaut.library") version "5.0.2"
    id("maven-publish")
}

version = "0.1." + (findProperty("buildNumber") ?: "3")
group = "net.pilgrim"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-inject-java")

    api("io.projectreactor:reactor-core")
    api("io.netty:netty-transport")
    api("io.netty:netty-codec")
    api("io.netty:netty-handler")
    api("org.slf4j:slf4j-api")
    api(project(":micronaut-sdp"))
    api(project(":micronaut-rtp"))

    compileOnly("io.micronaut:micronaut-inject-java")
    compileOnly("io.micronaut:micronaut-context")
    compileOnly("io.micronaut:micronaut-http-client")
    compileOnly(project(":micronaut-vxml"))

    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("io.projectreactor:reactor-test")
    testImplementation(project(":micronaut-vxml"))
    testImplementation("io.micronaut:micronaut-context")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly("ch.qos.logback:logback-classic")
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
    withSourcesJar()
    withJavadocJar()
}

micronaut {
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("net.pilgrim.mrcp.*")
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = "net.pilgrim"
            artifactId = "micronaut-mrcp"
            version = project.version

            pom {
                name = "Micronaut MRCP"
                description = "MRCPv2 (RFC 6787) protocol engine, channel manager, and Mistral Audio models adapter"
                url = "https://github.com/net-pilgrim/micronaut-sip"
                licenses {
                    license {
                        name = "GNU Affero General Public License v3.0"
                        url = "https://www.gnu.org/licenses/agpl-3.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "author"
                        name = "Micronaut SIP Contributor"
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/" + (System.getenv("GITHUB_REPOSITORY") ?: "net-pilgrim/micronaut-sip"))
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: ""
            }
        }
    }
}
