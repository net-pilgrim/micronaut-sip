plugins {
    id("io.micronaut.library") version "5.0.2"
    id("maven-publish")
}

version = "0.1." + (findProperty("buildNumber") ?: "3")
group = "net.pilgrim"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-inject-java")

    api("io.projectreactor:reactor-core")
    api("io.netty:netty-transport")
    api("io.netty:netty-codec")

    compileOnly("io.micronaut:micronaut-inject-java")
    compileOnly("io.micronaut:micronaut-management")
    compileOnly("io.micronaut.micrometer:micronaut-micrometer-core")

    testImplementation("io.micronaut:micronaut-management")
    testImplementation("io.micronaut.micrometer:micronaut-micrometer-core")
    testImplementation("io.projectreactor:reactor-test")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testRuntimeOnly("ch.qos.logback:logback-classic")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
    withSourcesJar()
    withJavadocJar()
}

micronaut {
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("net.pilgrim.sip.*")
    }
}

tasks.withType(AbstractTestTask).configureEach {
    failOnNoDiscoveredTests = false
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = "net.pilgrim"
            artifactId = "micronaut-sip"
            version = project.version

            pom {
                name = "Micronaut SIP"
                description = "Reactive SIP (RFC 3261) library for Micronaut over UDP and TCP"
                url = "https://github.com/example/micronaut-sip"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "author"
                        name = "Micronaut SIP Contributor"
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/" + (System.getenv("GITHUB_REPOSITORY") ?: "example/micronaut-sip"))
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: ""
            }
        }
    }
}
