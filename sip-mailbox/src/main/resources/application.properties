micronaut.application.name=sip-mailbox
micronaut.object-storage.local.default.enabled=true
micronaut.object-storage.local.default.path=build/storage/mailbox

sip.server.host=0.0.0.0
sip.server.port=5060
sip.server.transport=udp
sip.server.advertised-ip=127.0.0.1

rtp.bind-address=127.0.0.1
rtp.port-range-start=30000
rtp.port-range-end=35000

mailbox.enabled=true
mailbox.user=mailbox
mailbox.max-recording-seconds=30
mailbox.finish-dtmf=#
