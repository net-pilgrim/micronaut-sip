apiVersion: v1
kind: ConfigMap
metadata:
  name: micronaut-netann-config
  namespace: sip-system
  labels:
    app.kubernetes.io/name: micronaut-netann
    app.kubernetes.io/component: media-server
    app.kubernetes.io/part-of: micronaut-sip
data:
  application.properties: |
    micronaut.application.name=micronaut-netann
    
    # UDP Signaling Configuration
    sip.server.udp-enabled=true
    sip.server.udp.host=0.0.0.0
    sip.server.udp.port=5060
    
    # TCP Signaling Configuration
    sip.server.tcp-enabled=true
    sip.server.tcp.host=0.0.0.0
    sip.server.tcp.port=5060

    # Advertised IP (Downward API status.hostIP)
    sip.server.advertised-ip=${SIP_SERVER_ADVERTISED_IP:}

    # NetAnn Service Identifier & Limits
    sip.server.enabled=true
    sip.server.server-name=Micronaut-NetAnn/1.0
    sip.server.request-timeout-ms=5000
    sip.server.auto-cancel-enabled=true
    sip.server.trying-delay-ms=200

    # NetAnn Audio & Security Controls (RFC 4240)
    netann.audio.http-enabled=false
    netann.audio.ssrf-protection-enabled=true
    netann.audio.max-audio-size-bytes=10485760
    netann.call.max-duration-seconds=300
    netann.call.max-active-announcements=500
    netann.call.max-announcements-per-ip=20
    netann.call.max-repeat-count=100
    
    # Token-Bucket Rate Limiting (RFC 3261 §21.5.4)
    sip.server.rate-limit.enabled=true
    sip.server.rate-limit.requests-per-second=100
    sip.server.rate-limit.burst-capacity=200
    sip.server.rate-limit.retry-after-seconds=5
    sip.server.rate-limit.whitelist=127.0.0.1,::1,10.0.0.0/8
    sip.server.rate-limit.max-tracked-ips=10000
    
    # Logging and Tracing
    sip.server.access-log.enabled=true
    sip.server.mdc.enabled=true
    
    # Session Management
    sip.server.session-ttl-ms=1800000
    sip.server.max-sessions=10000
    
    # Dynamic RTP Port Manager Allocation Range
    rtp.media.min-port=10000
    rtp.media.max-port=20000
    
    # Micronaut Health & Metrics Endpoints
    endpoints.health.enabled=true
    endpoints.health.sensitive=false
    endpoints.health.details-visible=ANONYMOUS
    endpoints.metrics.enabled=true
    endpoints.metrics.sensitive=false
    endpoints.prometheus.enabled=true
    endpoints.prometheus.sensitive=false
