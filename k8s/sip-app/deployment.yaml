apiVersion: apps/v1
kind: Deployment
metadata:
  name: sip-app
  namespace: sip-system
  labels:
    app.kubernetes.io/name: sip-app
    app.kubernetes.io/component: signaling
    app.kubernetes.io/part-of: micronaut-sip
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sip-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sip-app
        app.kubernetes.io/component: signaling
        app.kubernetes.io/part-of: micronaut-sip
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/prometheus"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: sip-app
          image: net-pilgrim/sip-app:0.1.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: sip-udp
              containerPort: 5060
              hostPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              hostPort: 5060
              protocol: TCP
            - name: http-mgmt
              containerPort: 8080
              hostPort: 8080
              protocol: TCP
            - name: rtp-10000
              containerPort: 10000
              hostPort: 10000
              protocol: UDP
            - name: rtp-10002
              containerPort: 10002
              hostPort: 10002
              protocol: UDP
            - name: rtp-10004
              containerPort: 10004
              hostPort: 10004
              protocol: UDP
            - name: rtp-10006
              containerPort: 10006
              hostPort: 10006
              protocol: UDP
            - name: rtp-10008
              containerPort: 10008
              hostPort: 10008
              protocol: UDP
            - name: rtp-10010
              containerPort: 10010
              hostPort: 10010
              protocol: UDP
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "k8s,prod"
            - name: SIP_SERVER_ADVERTISED_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SIP_SERVER_UDP_HOST
              value: "0.0.0.0"
            - name: SIP_SERVER_UDP_PORT
              value: "5060"
            - name: SIP_SERVER_TCP_HOST
              value: "0.0.0.0"
            - name: SIP_SERVER_TCP_PORT
              value: "5060"
            - name: MICRONAUT_CONFIG_FILES
              value: "/home/app/config/application.properties"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http-mgmt
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http-mgmt
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http-mgmt
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /home/app/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: sip-app-config
