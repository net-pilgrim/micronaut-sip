plugins {
    id("io.micronaut.library") version "5.0.2"
    id("maven-publish")
}

version = "0.1." + (findProperty("buildNumber") ?: "3")
group = "net.pilgrim"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-inject-java")

    api(project(":statemachine-core"))
    api(project(":micronaut-sip"))
    api(project(":micronaut-rtp"))
    api(project(":micronaut-sdp"))
    api(project(":micronaut-vxml"))
    api(project(":micronaut-msml"))

    api("io.projectreactor:reactor-core")
    api("org.slf4j:slf4j-api")

    compileOnly("io.micronaut:micronaut-inject-java")
    compileOnly("io.micronaut:micronaut-context")

    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("io.projectreactor:reactor-test")
    testImplementation("io.micronaut:micronaut-context")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
    withSourcesJar()
    withJavadocJar()
}

micronaut {
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("net.pilgrim.ccxml.*")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.addAll([
        "-parameters"
    ])
}
